# Gate-1/N=1 harness-parity check: xgap's own harness (standard init_state order)
# vs the official lerobot-eval CLI, on the same task/episode count, on libero_spatial
# task 0. See README "libero_spatial로 변경한다" for why this suite and this check.
#
# lerobot-eval reference to compare against: 3/5 (60%) on libero_spatial task 0,
# --policy.n_action_steps=10 (see README "Higher-priority than finishing the
# n_action_steps sweep" section). This config runs n_action_steps=1-equivalent
# (one policy call per env step -- see policy_rollout.py's rollout_policy_episode
# docstring for why that's fine to compare against: the project's own
# n_action_steps sweep already showed 1 vs 10 makes no success-rate difference).

experiment_name: policy_rollout_libero_spatial_smoke

local_output_root: outputs/policy_rollout_libero_spatial_smoke/_local
remote_output_root: /content/drive/MyDrive/xgap/outputs/policy_rollout_libero_spatial_smoke

task_suite: libero_spatial
task_ids: [0]
episodes_per_task: 5

checkpoint_path: HuggingFaceVLA/smolvla_libero
checkpoint_hash: unknown

# Inferred, not confirmed from source -- see config.py's PolicyRolloutConfig
# docstring. Watch rollout_length in this run's own output; raise this if
# episodes look like they're getting cut off before a real outcome.
max_steps: 520

control_mode: relative
control_freq: 20

sync_every_n_episodes: 5

resume: true
