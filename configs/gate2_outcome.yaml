# Gate 2, outcome-based verdict -- PILOT scale: 1 task, 2 seeds (1 failure
# + 1 success). See README "Gate 2, corrected: fixed absolute branch point,
# not a fraction" and scripts/run_gate2_outcome.py's module docstring
# (problem 3) for the full story: branch_fraction=0.5 was REJECTED after a
# real run -- task 0's real failure seeds all have rollout_length=520, so
# 0.5 landed at step 260, ~140-190 steps past where any real success
# trajectory would already have finished (66-121 steps). 26/26 candidates
# tested there ran their full step budget and still failed -- failure was
# already fully determined, unrecoverable by any candidate. A fraction of
# two wildly different episode lengths was never a fair comparison.
#
# prefix_length is now a FIXED absolute step count (40, inside the
# ~30-60 step grasp-critical window every trajectory -- success or
# failure -- passes through), applied identically regardless of a given
# source episode's own length. max_steps is back to an ABSOLUTE cap from
# episode step 0 (200, not Gate-1's 520) -- safe now that prefix_length is
# fixed and small; GateTwoOutcomeConfig validates
# prefix_length + exec_horizon < max_steps so this can't silently break
# again. Per-candidate cost should now be well under the ~265-300s seen
# with the broken 260-step branch point -- watch the printed
# `candidate=k/n ... elapsed=...` lines for the real number.
#
# A single failure-source seed with n_candidates=64 already gives a
# verdict on its own (see module docstring's "is_primary_signal" -- one
# failure-source point showing a mixed outcome is sufficient); the
# success-source seed here is a CONTRAST run, not required for the
# verdict itself, but confirms the harness behaves as expected
# (near-always-success from a good trajectory).
#
# If genuinely in a hurry: comment out the success seed below and run only
# the failure seed -- that alone answers "does Gate 2 pass or fail".
#
# Once this pilot passes (is_primary_signal true for the failure seed),
# scale up via configs/gate2_outcome_full.yaml (4 tasks x 4 seeds).

experiment_name: gate2_outcome_libero_spatial_pilot

local_output_root: outputs/gate2_outcome/_local
remote_output_root: /content/drive/MyDrive/xgap/outputs/gate2_outcome

task_suite: libero_spatial
task_ids: [0]
checkpoint_path: HuggingFaceVLA/smolvla_libero
checkpoint_hash: unknown

# Same shared source as gate2_diversity.yaml -- real recorded Gate-1 episodes.
source_output_root: /content/drive/MyDrive/xgap/outputs/policy_rollout_libero_spatial_gate1
source_condition: policy_rollout

# Real seeds from scripts/list_source_episode_outcomes.py's actual output
# for task 0 (Gate-1, libero_spatial): 12/20 succeeded --
# success seeds [0, 1, 3, 4, 5, 6, 9, 11, 12, 15, 17, 19],
# failure seeds [2, 7, 8, 10, 13, 14, 16, 18] (all ran the full 520-step
# cap, an ordinary failure shape, not an obviously broken one). Seed 2
# (failure, decides the pilot) and seed 0 (success, contrast only) picked
# as the first of each list -- no other reason to prefer these specific
# ones over other members of the same list.
source_episode_seeds:
  0: [2, 0]  # [failure_seed, success_seed]

# FIXED absolute step count, not a fraction of rollout_length -- see
# comment at top of file.
prefix_length: 40

exec_horizon: 10
n_candidates: 64
# ABSOLUTE cap on total episode steps from episode step 0 -- see comment
# at top of file. Must stay > prefix_length + exec_horizon (enforced by
# GateTwoOutcomeConfig's own validation).
max_steps: 200

control_mode: relative
control_freq: 20

resume: true
