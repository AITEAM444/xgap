# Gate 2, outcome-based verdict -- FULL SCALE (4 tasks x 4 seeds each).
# Run configs/gate2_outcome.yaml (the pilot: 1 task, 2 seeds) FIRST -- only
# scale up to this once the pilot passes (is_primary_signal true for the
# failure-source seed). See README "Gate 2, corrected" and
# scripts/run_gate2_outcome.py's module docstring.
#
# prefix_length: FIXED absolute step count (40), NOT a fraction of each
# episode's rollout_length -- branch_fraction was tried and rejected after
# a real run: task 0's real failure seeds all have rollout_length=520, so
# branch_fraction=0.5 landed at step 260, past where any real success
# trajectory would already have finished (66-121 steps) -- unrecoverable,
# confirmed by 26/26 candidates there running the full step budget and
# still failing. See README "Gate 2, corrected: fixed absolute branch
# point, not a fraction" and scripts/run_gate2_outcome.py's module
# docstring (problem 3) for the full story. Outcome (success/fail) is the
# only thing Gate 2 is judged on.

experiment_name: gate2_outcome_libero_spatial_full

local_output_root: outputs/gate2_outcome/_local
remote_output_root: /content/drive/MyDrive/xgap/outputs/gate2_outcome

task_suite: libero_spatial
task_ids: [0, 2, 4, 5]
checkpoint_path: HuggingFaceVLA/smolvla_libero
checkpoint_hash: unknown

# Same shared source as gate2_diversity.yaml -- real recorded Gate-1 episodes.
source_output_root: /content/drive/MyDrive/xgap/outputs/policy_rollout_libero_spatial_gate1
source_condition: policy_rollout

# PLACEHOLDER seeds below (999/998 -- deliberately out of range, so
# load_source_episode's own FileNotFoundError fails loudly instead of
# silently running against the wrong episode if you forget to replace
# these). Run scripts/list_source_episode_outcomes.py per task first:
#   python scripts/list_source_episode_outcomes.py \
#       --source-output-root /content/drive/MyDrive/xgap/outputs/policy_rollout_libero_spatial_gate1 \
#       --condition policy_rollout --task-suite libero_spatial --task-id 0
# then pick ~2 real success seeds + ~2 real failure seeds per task from its
# printed list (failure seeds matter more -- see module docstring, problem 2).
# Task 0 already known from the pilot: success [0,1,3,4,5,6,9,11,12,15,17,19],
# failure [2,7,8,10,13,14,16,18] (all rollout_length=520 -- factor that into
# per-candidate cost expectations, see module docstring bug 3 and the
# pilot config's own comment). Every task_id above must have a non-empty
# entry here.
source_episode_seeds:
  0: [2, 7, 0, 1]  # real: 2 failure (2, 7) + 2 success (0, 1) seeds
  2: [999, 998]    # PLACEHOLDER -- replace with real task-2 seeds
  4: [999, 998]    # PLACEHOLDER -- replace with real task-4 seeds
  5: [999, 998]    # PLACEHOLDER -- replace with real task-5 seeds

prefix_length: 40

exec_horizon: 10
n_candidates: 64
# ABSOLUTE cap on total episode steps from episode step 0 -- safe now that
# prefix_length is fixed and small; must stay > prefix_length + exec_horizon
# (enforced by GateTwoOutcomeConfig's own validation).
max_steps: 200

control_mode: relative
control_freq: 20

resume: true
