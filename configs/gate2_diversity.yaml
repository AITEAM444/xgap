# Gate 2 (candidate diversity): does the policy propose meaningfully
# different candidates from the same observation? See README "Gate 2:
# candidate diversity" and scripts/run_gate2_diversity.py's module docstring.
#
# Experiment-set tasks per the request: 0, 2, 4, 5 (task 1 excluded on
# purpose -- it's the one that already showed the single-mode-collapse
# concern in Gate-1, 19/20 episodes near-identical; checking whether that
# tendency also shows up in the tasks actually meant for Oracle-curve work).

experiment_name: gate2_diversity_libero_spatial

local_output_root: outputs/gate2_diversity/_local
remote_output_root: /content/drive/MyDrive/xgap/outputs/gate2_diversity

task_suite: libero_spatial
task_ids: [0, 2, 4, 5]
checkpoint_path: HuggingFaceVLA/smolvla_libero
checkpoint_hash: unknown

# Real recorded episodes from the Gate-1 run(s) -- same shared
# remote_output_root every task_ids=[N] config (main + per-teammate) writes
# to, so this works regardless of which config actually produced each
# task's episode 0, as long as it landed here.
source_output_root: /content/drive/MyDrive/xgap/outputs/policy_rollout_libero_spatial_gate1
source_condition: policy_rollout
source_episode_seed: 0

# DIAGNOSTIC ONLY, not the Gate 2 verdict -- see scripts/run_gate2_diversity.py's
# module docstring. First result at 0.2 showed real action-level diversity
# (mean_pairwise_l2 ~4.2-4.6, gripper channel split ~50/50) but ~300x smaller
# endpoint-position spread. Traced to the real cause, not left ambiguous:
# frac_commanding_close went 0.53 (at 0.2) to 0.85 (at 0.5) -- candidates DO
# differ on WHEN they close the gripper -- but exec_horizon=10 is shorter
# than the gripper's own 15-20 step actuation lag, so that timing difference
# never reaches the endpoint measurement. The metric can't be fixed by
# sweeping further; it's the wrong measurement window, not the wrong branch
# point. Endpoint-variance measurement STOPS after this 0.7 point finishes --
# do not add more fractions here. Gate 2's actual verdict now comes from
# scripts/run_gate2_outcome.py (episode success/fail), not this script.
branch_step_fractions: [0.2, 0.5, 0.7]

n_candidates: 64
# Steps of each candidate chunk actually EXECUTED for the endpoint-variance
# metric (not the full predicted chunk, to bound cost -- this project's own
# exec_horizon config concept, finally in real use).
exec_horizon: 10

control_mode: relative
control_freq: 20
gripper_dim: 6

resume: true
